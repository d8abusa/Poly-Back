# AXIOM — Quantitative Research Engine Configuration
# OpenClaw Multi-Agent System for PolyBack

agent:
  name: "AXIOM"
  role: "Quantitative Analysis & Backtesting"
  model: "claude-opus-4-6"
  temperature: 0.2
  max_tokens: 5120

system_prompt: |
  You are AXIOM, the Quantitative Research Engine for PolyBack.
  Your responsibility is rigorous statistical analysis, strategy backtesting,
  and performance validation. Never execute trades or modify code — you provide
  numerical analysis that informs decisions by other agents.

capabilities:
  - "backtesting": "Historical simulation of trading strategies"
  - "metrics_calculation": "Sharpe ratio, max drawdown, win rate, profit factor"
  - "statistical_validation": "Significance testing, overfitting detection"
  - "risk_modeling": "Monte Carlo simulations, variance calculations"

context:
  working_directory: "/home/robert-nichols/quant_project/Polymarket"
  docs_path: "./docs/prompts/axiom.md"
  research_output: "./docs/research"
  data_input: "./data/market-history"

memory:
  type: "file-based"
  directory: "./memory/axiom"
  persist_session: true
  max_history_messages: 100

tools:
  file_read:
    enabled: true
    description: "Read strategy definitions, historical data, previous results"
  file_write:
    enabled: true
    paths:
      - "./docs/research/"
      - "./memory/axiom/"
    description: "Write analysis reports and save research findings"
  bash_read:
    enabled: true
    commands:
      - "ls"
      - "cat"
      - "head"
      - "python3"
    allow_execution: false
    description: "Read-only commands for data inspection"

communication:
  receives_from: ["NEXUS"]
  sends_to:
    - "NEXUS": "Analysis reports and backtest results"
    - "LENS": "Data requests for market context"
    - "HARBOR": "Risk flags when analysis reveals concerns"
  protocols:
    report: |
      # BACKTEST REPORT: [Strategy Name]
      ## Parameters
      ## Performance Summary
      ## Trade Statistics
      ## Equity Curve Analysis
      ## Statistical Significance
      ## Weaknesses Identified
      ## Recommendation

data_processing:
  python_enabled: true
  libraries: ["numpy", "pandas", "scipy"]
  output_formats: ["markdown", "json", "csv"]

analysis_templates:
  standard_backtest: "Full historical simulation with all metrics"
  parameter_sweep: "Test multiple parameter combinations"
  stress_test: "Worst-case scenario modeling"
  regime_analysis: "Performance across market conditions"

security:
  write_restrictions: "Can only write to ./docs/research/ and ./memory/axiom/"
  code_execution: "Python allowed for calculations only — no file system access"

logging:
  level: "info"
  file: "./logs/agents/axiom.log"
  include_calculation_details: true

state:
  initialize_on_startup: false
  save_analysis_cache: true
  cache_ttl_hours: 168
